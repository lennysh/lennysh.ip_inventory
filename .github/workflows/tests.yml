---
name: "CI"

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [devel]
  merge_group:
    branches: [devel]
  workflow_dispatch:
  # TO-DO: Below is an example cron scheduler. Uncomment and tweak it as per your requirement
  # schedule:
    # - cron: '0 0 * * *'

jobs:
  changelog:
    uses: ansible/ansible-content-actions/.github/workflows/changelog.yaml@main
    # Dependency bumps from Dependabot don't belong in the release notes.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
  build-import:
    uses: ansible/ansible-content-actions/.github/workflows/build_import.yaml@main
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: tcort/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          check-modified-files-only: 'yes'
          config-file: '.mlc_config.json'
          base-branch: >-
            ${{ github.base_ref || (github.event_name == 'merge_group' && 'devel') || github.ref_name || 'main' }}
  ansible-lint:
    uses: ansible/ansible-content-actions/.github/workflows/ansible_lint.yaml@main
  sanity:
    uses: ./.github/workflows/tests_sanity.yml
    with:
      # AAP floor alignment: ansible-core 2.16 + Python 3.12 (see meta/runtime.yml)
      extra_matrix_entries: >-
        [{"description":"Sanity tests using ansible-core 2.16 and python 3.12","factors":["sanity","py3.12","2.16"],"name":"sanity-py3.12-2.16","python":"3.12"}]
  unit-galaxy:
    needs:
      - ansible-lint
    uses: ./.github/workflows/tests_unit.yml
    with:
      extra_matrix_entries: >-
        [{"description":"Unit tests using ansible-core 2.16 and python 3.12","factors":["unit","py3.12","2.16"],"name":"unit-py3.12-2.16","python":"3.12"}]
  e2e:
    # Runs the roles, the inventory plugin, real (loopback) ICMP and the report-delivery example
    # against tests/e2e/mock_api.py (all four source APIs) and tests/e2e/smtp_sink.py.
    name: End-to-end (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ansible:
          - "2.16"
          - "2.18"
          - "2.20"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ansible-core ${{ matrix.ansible }}
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core~=${{ matrix.ansible }}.0"
          ansible --version
      - name: Build and install the collection
        run: |
          ansible-galaxy collection build --force --output-path "${RUNNER_TEMP}"
          ansible-galaxy collection install --force "${RUNNER_TEMP}"/lennysh-ip_inventory-*.tar.gz
          ansible-galaxy collection install -r .github/collections/requirements.yml
      - name: Run end-to-end tests
        run: tests/e2e/run.sh
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
  all_green:
    if: ${{ always() }}
    needs:
      - changelog
      - build-import
      - sanity
      - unit-galaxy
      - ansible-lint
      - e2e
      - markdown-link-check
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGELOG: ${{ needs.changelog.result }}
          BUILD_IMPORT: ${{ needs.build-import.result }}
          ANSIBLE_LINT: ${{ needs.ansible-lint.result }}
          MARKDOWN_LINK_CHECK: ${{ needs.markdown-link-check.result }}
          SANITY: ${{ needs.sanity.result }}
          UNIT_GALAXY: ${{ needs.unit-galaxy.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          rc=0
          check_not_failed() {
            echo "$1: $2"
            case "$2" in
              failure|cancelled) echo "::error::$1 $2"; rc=1 ;;
            esac
          }
          require_success() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 must succeed (got '$2')"
              rc=1
            fi
          }
          # changelog only runs on pull_request, so it may be skipped elsewhere.
          check_not_failed changelog "$CHANGELOG"
          check_not_failed markdown-link-check "$MARKDOWN_LINK_CHECK"
          require_success build-import "$BUILD_IMPORT"
          require_success ansible-lint "$ANSIBLE_LINT"
          require_success sanity "$SANITY"
          require_success unit-galaxy "$UNIT_GALAXY"
          require_success e2e "$E2E"
          exit $rc
