---
argument_specs:
  main:
    short_description: Collect IP observations from UniFi Network
    version_added: 1.0.0
    description:
      - Runs M(lennysh.ip_inventory.unifi_info) to read active clients, known clients and adopted devices, applies include/exclude
        rules and appends the records to C(ip_inventory_observations).
    author:
      - Lenny Shirley (@lennysh)
    options:
      ip_inventory_unifi_url:
        type: str
        description: UniFi console/controller URL. Falls back to E(UNIFI_URL).
      ip_inventory_unifi_api_key:
        type: str
        description: API key (recommended on UniFi OS). Falls back to E(UNIFI_API_KEY). Store it in Ansible Vault.
        no_log: true
      ip_inventory_unifi_username:
        type: str
        description: Local admin username when no API key is used. Falls back to E(UNIFI_USERNAME).
      ip_inventory_unifi_password:
        type: str
        description: Password. Falls back to E(UNIFI_PASSWORD).
        no_log: true
      ip_inventory_unifi_site:
        type: str
        description: UniFi site name.
        default: default
      ip_inventory_unifi_unifi_os:
        type: bool
        description: UniFi OS console (true) or legacy Network Application (false).
        default: true
      ip_inventory_unifi_validate_certs:
        type: bool
        description: Verify TLS certificates.
        default: false
      ip_inventory_unifi_timeout:
        type: int
        description: HTTP timeout in seconds.
        default: 30
      ip_inventory_unifi_collect:
        type: dict
        description: Datasets to collect (active_clients, known_clients, devices).
        default: {}
      ip_inventory_unifi_filters:
        type: dict
        description: Per-source include/exclude rules, stacked on C(ip_inventory_filters).
        default: {}
      ip_inventory_filters:
        type: dict
        default: {}
        description: Global include/exclude rules applied to every source.
      ip_inventory_ignore_source_errors:
        type: bool
        default: false
        description: Record a failure in C(ip_inventory_source_stats) and continue instead of failing the play.
