---
argument_specs:
  main:
    short_description: Ping known hosts and optionally sweep subnets for unknown ones
    version_added: 1.0.0
    description:
      - Pings every IP in C(ip_inventory_hosts) with M(lennysh.ip_inventory.icmp_ping) and sets C(ping_status).
      - With O(ip_inventory_discover_unknown), pings the unused addresses of each collected subnet and adds
        responders as C(discovered) rows (also published as C(ip_inventory_discovered)).
      - Pings are sent from the host running the play, so run it somewhere that can reach your networks.
    author:
      - Lenny Shirley (@lennysh)
    options:
      ip_inventory_hosts:
        type: list
        elements: dict
        required: true
        description: Reconciled host records (from the C(reconcile) role).
      ip_inventory_subnets:
        type: list
        elements: dict
        default: []
        description: Subnet records used for the sweep.
      ip_inventory_ping_enabled:
        type: bool
        default: true
        description: Ping known hosts.
      ip_inventory_ping_timeout:
        type: float
        default: 1.0
        description: Seconds to wait for each reply.
      ip_inventory_ping_concurrency:
        type: int
        default: 50
        description: Parallel pings.
      ip_inventory_discover_unknown:
        type: bool
        default: false
        description: Sweep unused subnet addresses for unknown responders.
      ip_inventory_discover_private_only:
        type: bool
        default: true
        description: Only sweep private and link-local subnets.
      ip_inventory_discover_max_hosts_per_subnet:
        type: int
        default: 512
        description: Skip subnets larger than this many usable addresses.
