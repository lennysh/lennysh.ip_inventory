---
# Job template playbook (same as docs/examples/deliver_reports.yml). Runs the pipeline in the
# execution environment (localhost), then delivers the reports, which would otherwise vanish
# with the EE. Secrets come from the "IP Inventory Sources" credential as environment variables.
# A real play rather than import_playbook, so group_vars/ next to this file is loaded.
- name: IP inventory with report delivery
  hosts: localhost
  gather_facts: false
  roles:
    - role: lennysh.ip_inventory.run

  tasks:
    - name: Pick the generated report files
      ansible.builtin.set_fact:
        report_html: "{{ ip_inventory_report_files | select('search', '/inventory[^/]*\\.html$') | first | default('') }}"
        report_attachments: "{{ ip_inventory_report_files | select('search', '\\.(csv|md)$') | list }}"

    - name: Publish the HTML report on the web server
      when: report_web_host | length > 0 and report_html | length > 0
      delegate_to: "{{ report_web_host or inventory_hostname }}"   # fallback only matters when skipped
      become: "{{ report_web_become | default(true) }}"
      block:
        - name: Ensure the web directory exists
          ansible.builtin.file:
            path: "{{ report_web_root }}"
            state: directory
            mode: "0755"

        - name: Copy the HTML report as index.html
          ansible.builtin.copy:
            src: "{{ report_html }}"
            dest: "{{ report_web_root }}/index.html"
            mode: "0644"

    - name: Email the reports
      community.general.mail:
        host: "{{ report_smtp_host }}"
        port: "{{ report_smtp_port }}"
        from: "{{ report_mail_from }}"
        to: "{{ report_mail_to }}"
        subject: >-
          IP inventory: {{ ip_inventory_summary.hosts }} hosts,
          {{ ip_inventory_summary.issues.total }} finding(s)
          ({{ ip_inventory_summary.issues.by_severity.high | default(0) }} high)
        body: "{{ lookup('ansible.builtin.file', report_html) if report_html else 'See attachments.' }}"
        subtype: html
        attach: "{{ report_attachments }}"
      when: report_mail_to | length > 0
