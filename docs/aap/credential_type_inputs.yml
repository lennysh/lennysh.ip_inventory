---
# Input configuration for the "IP Inventory Sources" custom credential type.
# Every field is optional: fill in only the sources you use.
fields:
  - id: opnsense_api_key
    type: string
    label: OPNsense API key
    secret: true
  - id: opnsense_api_secret
    type: string
    label: OPNsense API secret
    secret: true
  - id: technitium_token
    type: string
    label: Technitium API token
    secret: true
    help_text: Preferred. Leave empty to log in with username/password instead.
  - id: technitium_username
    type: string
    label: Technitium username
  - id: technitium_password
    type: string
    label: Technitium password
    secret: true
  - id: proxmox_token_id
    type: string
    label: Proxmox API token ID
    help_text: user@realm!tokenname
  - id: proxmox_token_secret
    type: string
    label: Proxmox API token secret
    secret: true
  - id: unifi_api_key
    type: string
    label: UniFi API key
    secret: true
    help_text: Preferred on UniFi OS. Leave empty to log in with username/password instead.
  - id: unifi_username
    type: string
    label: UniFi username
  - id: unifi_password
    type: string
    label: UniFi password
    secret: true
required: []
