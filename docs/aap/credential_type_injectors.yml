---
# Injector configuration for the "IP Inventory Sources" custom credential type.
# The collection's modules and inventory plugin read these environment variables when the
# matching option is not set, so the same credential works for job templates AND inventory
# sources (AAP does not pass extra_vars injectors to inventory updates).
env:
  OPNSENSE_API_KEY: "{{ opnsense_api_key }}"
  OPNSENSE_API_SECRET: "{{ opnsense_api_secret }}"
  TECHNITIUM_TOKEN: "{{ technitium_token }}"
  TECHNITIUM_USER: "{{ technitium_username }}"
  TECHNITIUM_PASSWORD: "{{ technitium_password }}"
  PROXMOX_TOKEN_ID: "{{ proxmox_token_id }}"
  PROXMOX_TOKEN_SECRET: "{{ proxmox_token_secret }}"
  UNIFI_API_KEY: "{{ unifi_api_key }}"
  UNIFI_USERNAME: "{{ unifi_username }}"
  UNIFI_PASSWORD: "{{ unifi_password }}"
